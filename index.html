<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎮 NovaPlay</h1>

        <nav>
            <a href="#">Ana Sayfa</a>
            <a href="#">Oyunlar</a>
            <a href="#">Popüler</a>
            <a href="#">İletişim</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Ücretsiz Oyun Dünyasına Hoş Geldin!</h2>
            <p>Yüzlerce ücretsiz oyunu tek tıkla oyna.</p>

            <button id="playBtn">Şimdi Oyna</button>
        </section>

        <section class="games">

            <div class="card">
                <h3>🐍 Yılan</h3>
                <p>Klasik Snake oyunu.</p>
                <br>
                <a href="games/snake/index.html">
                    <button>Oyna</button>
                </a>
            </div>

            <div class="card">
                <h3>❌⭕ X-O-X</h3>
                <p>Arkadaşına meydan oku.</p>
                <br>
                <a href="games/tictactoe/index.html">
                    <button>Oyna</button>
                </a>
            </div>

            <div class="card">
                <h3>🧱 Breakout</h3>
                <p>Tüm tuğlaları kır.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
