<!DOCTYPE html>
<html lang="tr">

<head>


<title>NovaPlay - Ücretsiz Online Oyunlar</title>

<meta name="description" content="NovaPlay ile ücretsiz online oyunlar oyna. Snake, XOX, Breakout ve Flappy gibi eğlenceli oyunlar burada!">

<meta name="keywords" content="NovaPlay, ücretsiz oyunlar, online oyun, yılan oyunu, XOX, breakout, flappy">

<meta name="author" content="NovaPlay">

</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay</title>

    <link rel="stylesheet" href="style.css">
    <title>NovaPlay | Ücretsiz Online Oyunlar</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="NovaPlay, ücretsiz online oyunlar oynayabileceğiniz modern oyun platformudur. Snake, XOX, Breakout, Flappy Bird ve daha fazlası!">

<meta name="keywords" content="NovaPlay, oyun, ücretsiz oyunlar, snake, breakout, xox, flappy bird">

<meta name="author" content="NovaPlay">

<link rel="icon" type="image/png" href="logo.png">

<meta property="og:title" content="NovaPlay">
<meta property="og:description" content="Ücretsiz online oyun platformu.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"NovaPlay",
  "url":"https://alituna07.github.io/NovaPlay/",
  "logo":"https://alituna07.github.io/NovaPlay/logo.png"
}
</script>
</head>

<body>
    
<div class="profile-box">
    <div id="avatar">👤</div>

    <div class="profile-info">
        <span id="username">Misafir</span>
        <small>🎮 Nova Oyuncusu</small>

        <div class="xp-bar">
            <div id="xp-fill"></div>
        </div>

        <span id="levelText">⭐ Seviye 1</span>
    </div>

    <button id="profileBtn">⚙️</button>
</div>
<header>
   <img src="logo.png" class="logo" alt="NovaPlay Logo">


    <h1>🎮 NovaPlay</h1>
    <p>Ücretsiz oyun merkezi</p>
    
</header>
<div class="search-box">

    <input 
    type="text" 
    id="searchInput" 
    placeholder="🔎 Oyun ara..."
    >

</div>

<div class="games">

<div class="game-card">
<h3>🐍 Snake</h3>
<p>Klasik yılan oyunu</p>
<a href="games/snake/index.html">
<button>Oyna</button>
</a>
</div>


<div class="game-card">
<h3>❌⭕ XOX</h3>
<p>Zeka ve strateji oyunu</p>
<a href="games/xox/index.html">
<button>Oyna</button>
</a>
</div>


<div class="game-card">
<h3>🧱 Breakout</h3>
<p>Tuğlaları kır!</p>
<a href="games/breakout/index.html">
<button>Oyna</button>
</a>
</div>


<div class="game-card">
<h3>🐦 Flappy</h3>
<p>Engellerden kaç!</p>
<a href="games/flappy/index.html">
<button>Oyna</button>
</a>
</div>
<div class="game-card">
    <h3>🏓 Ping Pong</h3>
    <p>Klasik masa tenisi oyunu. Rakibini yen ve en yüksek skoru yap!</p>

    <a href="games/pingpong/index.html">
        <button>Oyna</button>
    </a>
</div>

</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <h2>Profil Oluştur</h2>

        <input id="nameInput" placeholder="Kullanıcı adı">

        <h3>Avatar Seç</h3>

        <div class="avatars">
            <button onclick="selectAvatar('🐺')">🐺</button>
            <button onclick="selectAvatar('🤖')">🤖</button>
            <button onclick="selectAvatar('🐱')">🐱</button>
            <button onclick="selectAvatar('🦊')">🦊</button>
            <button onclick="selectAvatar('👾')">👾</button>
        </div>

        <button onclick="saveProfile()">Kaydet</button>
    </div>
</div>
<script src="script.js"></script>
<div id="notification" class="notification">
    <span id="notificationText"></span>
</div>
<canvas id="confettiCanvas"></canvas>
</body>
</html>
