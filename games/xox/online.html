<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online XOX</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>🌐 Online XOX</h1>

<div class="onlineMenu">

    <input
        id="playerName"
        placeholder="Kullanıcı adın">

    <button id="createRoom">
        🎮 Oda Oluştur

    <input
        id="roomCode"
        placeholder="Oda Kodu">

    <button id="joinRoom">
        🚪 Odaya Katıl
    </button>

</div>

<p id="status"></p>

<script type="module" src="online.js"></script>
</body>
</html>
