<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Bomberman</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameContainer">

    <header id="hud">

        <div class="hud-item">
            ❤️ <span id="lives">3</span>
        </div>

        <div class="hud-item">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hud-item">
            ⭐ <span id="xp">0</span>
        </div>

        <div class="hud-item">
            💣 <span id="bombs">1</span>
        </div>

        <div class="hud-item">
            🔥 <span id="power">1</span>
        </div>

        <div class="hud-item">
            ⏱ <span id="timer">180</span>
        </div>
        <div class="hud-item">
🏁 <span id="level">1</span>
</div>

    </header>

    <canvas id="gameCanvas" width="832" height="576"></canvas>
<div id="gameOverScreen" class="hidden">

    <div class="game-over-box">

        <h1 id="gameOverTitle">⏰ Süre Doldu!</h1>

        <p>🪙 NovaCoin: <span id="gameOverCoins">0</span></p>
        <p>⭐ XP: <span id="gameOverXP">0</span></p>

        <button onclick="location.reload()">
            🔄 Tekrar Oyna
        </button>

        <button onclick="location.href='../../index.html'">
            🏠 Ana Menü
        </button>

    </div>

</div>
</div>

<script src="config.js"></script>
<script src="storage.js"></script>
<script src="sound.js"></script>
<script src="player.js"></script>
<script src="world.js"></script>
<script src="bombs.js"></script>
<script src="levels.js"></script>
<script src="enemy.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>
</body>
</html>
