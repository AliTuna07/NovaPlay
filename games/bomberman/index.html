<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay | Bomberman</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameContainer">

    <header id="hud">

        <div class="hud-item">
            ❤️ <span id="lives">3</span>
        </div>

        <div class="hud-item">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hud-item">
            ⭐ <span id="xp">0</span>
        </div>

        <div class="hud-item">
            💣 <span id="bombs">1</span>
        </div>

        <div class="hud-item">
            🔥 <span id="power">1</span>
        </div>

        <div class="hud-item">
            ⏱ <span id="timer">180</span>
        </div>

    </header>

    <canvas id="gameCanvas" width="832" height="576"></canvas>

</div>

<script src="storage.js"></script>
<script src="sound.js"></script>
<script src="player.js"></script>
<script src="world.js"></script>
<script src="ui.js"></script>
<script src="script.js"></script>

</body>
</html>
