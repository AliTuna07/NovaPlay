<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online XOX</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<h1>🌐 Online XOX</h1>


<h2 id="roomInfo"></h2>

<h2 id="status">
Bağlanıyor...
</h2>
<div class="players">

    <div class="player-card" id="playerXCard">

        <div class="avatar frame-none" id="playerXAvatarFrame">
            <span id="playerXAvatar">👾</span>
        </div>

        <div class="player-info">

            <h3 id="playerXName">Bekleniyor...</h3>

            <div id="playerXRank">Nova Oyuncusu</div>

            <div id="playerXLevel">⭐ 1</div>

            <div class="xp-bar">
                <div class="xp-fill" id="playerXXP"></div>
            </div>

            <div id="playerXCoins">🪙 0</div>

            <div id="playerXWins">🏆 0</div>

        </div>

    </div>

    <div class="vs">VS</div>

    <div class="player-card" id="playerOCard">

        <div class="avatar frame-none" id="playerOAvatarFrame">
            <span id="playerOAvatar">👾</span>
        </div>

        <div class="player-info">

            <h3 id="playerOName">Bekleniyor...</h3>

            <div id="playerORank">Nova Oyuncusu</div>

            <div id="playerOLevel">⭐ 1</div>

            <div class="xp-bar">
                <div class="xp-fill" id="playerOXP"></div>
            </div>

            <div id="playerOCoins">🪙 0</div>

            <div id="playerOWins">🏆 0</div>

        </div>

    </div>

</div>

<div class="board">


<button class="cell" data-id="0"></button>
<button class="cell" data-id="1"></button>
<button class="cell" data-id="2"></button>

<button class="cell" data-id="3"></button>
<button class="cell" data-id="4"></button>
<button class="cell" data-id="5"></button>

<button class="cell" data-id="6"></button>
<button class="cell" data-id="7"></button>
<button class="cell" data-id="8"></button>


</div>


<button onclick="location.href='index.html'">
⬅ Çıkış
</button>


</div>



<script type="module" src="room.js"></script>


</body>

</html>
