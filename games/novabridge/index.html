<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NovaBridge Online</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- ======================================
         ANA MENÜ
    ====================================== -->

    <div id="ui">

        <div id="menu">

            <h1>NovaBridge Online</h1>

            <input
                id="playerName"
                type="text"
                placeholder="Oyuncu adı">

            <button id="createRoom">
                Oda Oluştur
            </button>

            <button id="joinRoom">
                Odaya Katıl
            </button>

            <button id="randomRoom">
                Rastgele Gir
            </button>

        </div>

    </div>


    <!-- ======================================
         OYUN
    ====================================== -->

    <canvas id="game"></canvas>


    <!-- ======================================
         MOBİL KONTROLLER
    ====================================== -->

    <div id="mobile-controls">

        <div id="joystick">

            <div id="joystick-knob"></div>

        </div>

        <div id="mobile-buttons">

            <button id="jump-button">
                ↑
            </button>

        </div>

    </div>


    <!-- ======================================
         SOHBET AÇ / KAPAT
    ====================================== -->

    <button id="chatToggle">
        💬
    </button>


    <!-- ======================================
         SOHBET KUTUSU
    ====================================== -->

    <div id="chatBox" class="chat-hidden">

        <!-- Başlık -->

        <div id="chatHeader">
            💬 Sohbet
        </div>


        <!-- Mesajlar -->

        <div id="chatMessages"></div>


        <!-- Mesaj gönderme -->

        <div id="chatInputArea">

            <input
                id="chatInput"
                type="text"
                maxlength="200"
                placeholder="Mesaj yaz..."
                autocomplete="off">

            <button id="chatSend">
                ➤
            </button>

        </div>

    </div>


    <!-- ======================================
         SCRIPT
    ====================================== -->

    <script
        type="module"
        src="script.js">
    </script>

    <script
        type="module"
        src="chat.js">
    </script>

</body>

</html>
