<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NovaBridge Online</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div id="ui">

        <div id="menu">

            <h1>NovaBridge Online</h1>

            <input
                id="playerName"
                type="text"
                placeholder="Oyuncu adı">

            <button id="createRoom">
                Oda Oluştur
            </button>

            <button id="joinRoom">
                Odaya Katıl
            </button>

            <button id="randomRoom">
                Rastgele Gir
            </button>

        </div>

    </div>


   
    <canvas id="game"></canvas>


    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
