<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Race</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="loading">
Nova Race Yükleniyor...
</div>


<div id="speedometer">

    <span id="speedValue">20</span>

    <small>KM/H</small>

</div>



<button onclick="location.href='settings.html'">
⚙️ Ayarlar
</button>
<button id="settingsButton">
⚙
</button>
<div id="gameOver">

    <h1>🏁 OYUN BİTTİ</h1>

    <h2 id="finalScore">
        Skor: 0
    </h2>

    <button onclick="location.reload()">
        🔄 Tekrar Oyna
    </button>

    <button onclick="goMainMenu()">
        🏠 Ana Menü
    </button>

</div>



<!-- NovaPlay ortak sistem -->
<script src="../../common.js"></script>



<script type="module" src="main.js"></script>
<script type="module" src="radio.js"></script>
<div id="radio">

    <div id="radioTitle">
        📻 NOVA RADIO
    </div>

    <div id="stationName">
        Chill FM
    </div>

    <div class="radioButtons">

        <button id="prevStation">◀</button>

        <button id="playStation">⏸</button>

        <button id="nextStation">▶</button>

    </div>

    <input
        id="radioVolume"
        type="range"
        min="0"
        max="100"
        value="60"
    >

</div>
</body>
<div id="distanceMeter">
    📏 <span id="distanceValue">0.00</span> KM
</div>

</html>
