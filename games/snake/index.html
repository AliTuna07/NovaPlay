<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaPlay Snake 2.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🐍 NovaPlay Snake 2.0</h1>

    <div class="topBar">

        <div>
            Skor
            <h2 id="score">0</h2>
        </div>

        <div>
            Rekor
            <h2 id="highscore">0</h2>
        </div>

    </div>

    <canvas
        id="game"
        width="400"
        height="400">
    </canvas>

    <div class="buttons">

        <button id="restart">
            🔄 Yeniden Oyna
        </button>

    </div>

    <div class="help">

        ⌨️ Ok Tuşları / WASD

        <br>

        ⏸️ P = Duraklat

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
